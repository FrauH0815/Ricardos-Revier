  if(v>level.zone[1])addPenalty(3,'überzogen');else say('Sitzt! ✓',600);
  h.n.userData.state='tight';h.n.position.z=.105;lastTight=i;sfx.tone(700,.08,'triangle',.12);updateHints();
  if(nuts.every(n=>n.userData.state==='tight'))setTimeout(()=>setPhase('lower'),400)}}
function nutLoosened(n){n.userData.state='off';sfx.tone(520,.06,'triangle',.1);
 // fly into the tray
 const from=nutWorld(n);scene.attach(n);const to=tray.position.clone().add(new THREE.Vector3((n.userData.i-2)*.03,.03,(n.userData.i%2)*.03));const t1=performance.now();
 (function fly(){const k=Math.min(1,(performance.now()-t1)/450);n.position.lerpVectors(from,to,k);n.position.y+=Math.sin(k*Math.PI)*.25;n.rotation.x+=.3;if(k<1)requestAnimationFrame(fly)})();
 if(nuts.every(x=>x.userData.state==='off'))setTimeout(()=>setPhase('lift'),400)}
function removeOld(){if(lift<.95){say('Erst ganz aufbocken!',900);return}sfx.noise(.3,300,1,.4);
 scene.attach(oldWheel);const from=oldWheel.position.clone(),t1=performance.now();
 swapAnim=()=>{const k=Math.min(1,(performance.now()-t1)/700);oldWheel.position.set(from.x+k*1.6,Math.max(.385,from.y-k*.1),from.z+k*.6);oldWheel.rotation.z-=.08;if(k>=1){swapAnim=null;setPhase('on')}}}
function mountNew(){sfx.noise(.25,250,1,.45);const target=new THREE.Vector3();const t1=performance.now(),from=newWheel.position.clone(),fromRot=newWheel.rotation.clone();
 swapAnim=()=>{hub.getWorldPosition(target);const k=Math.min(1,(performance.now()-t1)/700),e=1-Math.pow(1-k,3);newWheel.position.lerpVectors(from,target,e);newWheel.rotation.set(fromRot.x*(1-e),fromRot.y*(1-e),fromRot.z*(1-e));
  if(k>=1){swapAnim=null;hub.attach(newWheel);newWheel.position.set(0,0,0);newWheel.rotation.set(0,0,0);wheelOn=newWheel;
   nuts.forEach(n=>{hub.attach(n);n.rotation.set(0,0,0)});placeNutsOn(newWheel,'loose');sfx.click();setPhase('tighten')}}}
function finish(){state='done';const total=elapsed+penalty,idx=LEVELS.indexOf(level);
 const medal=total<=level.gold?'🥇':total<=level.silver?'🥈':'🥉';const key='reifen_best_'+level.id,best=progress.get(key,0);const isBest=!best||total<best;if(isBest)progress.set(key,+total.toFixed(1));
 progress.unlock('reifen',idx+1);trophy('reifen','level-'+level.id,`Reifenwechsel: ${level.name} geschafft`);
 if(total<30)trophy('reifen','boxenstopp','Boxenstopp: Reifenwechsel unter 30 Sekunden');if(medal==='🥇'&&level.id==='meister')trophy('reifen','meister-gold','Reifenwechsel: Gold als Meister');
 sfx.win();$('#cardTitle').textContent='Rad gewechselt!';$('#cardMedal').textContent=medal;
 $('#cardText').innerHTML=`Zeit ${fmt(elapsed)}${penalty?` + ${penalty} s Strafe`:''} = <b>${fmt(total)}</b>.<br>${isBest?'Neue Bestzeit! 🏁':`Bestzeit: ${fmt(best)}`}<br><small>Gold ≤ ${level.gold} s · Silber ≤ ${level.silver} s</small>`;
 $('#cardAgain').onclick=()=>startLevel(idx);$('#cardMenu').onclick=()=>{$('#card').classList.add('hidden');openMenu()};setTimeout(()=>$('#card').classList.remove('hidden'),700)}
const fmt=s=>s.toFixed(1).replace('.',',')+' s';
function openMenu(){state='menu';$('#step').classList.add('hide');const box=$('#levels');box.innerHTML='';const un=progress.unlocked('reifen');
 LEVELS.forEach((L,i)=>{const best=progress.get('reifen_best_'+L.id,0);const b=document.createElement('button');b.className='level'+(i>un?' locked':'');b.innerHTML=`<b>${i+1}. ${L.name}</b><small>${i>un?'🔒 Erst das vorige Level schaffen':L.text+(best?` · Bestzeit ${fmt(best)}`:'')}</small>`;if(i<=un)b.onclick=()=>startLevel(i);box.appendChild(b)});
 $('#menu').classList.remove('hidden')}

// ---------- loop ----------
function cameraFor(){const portrait=innerWidth<innerHeight,a=innerWidth/innerHeight,hf=2*Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*a);
 const spec={loosen:[0,.42,1.0],tighten:[0,.45+lift*.1,1.0],lift:[-.62,.3,1.45],off:[.5,.45,2.4],on:[.5,.45,2.4],lower:[-.5,.32,1.6]}[phase]||[0,.45,1.6];
 const width=spec[2],dist=Math.max(1.1,width/2/Math.tan(hf/2))*(portrait?1:.9);camLook.set(spec[0],spec[1],0);camGoal.set(spec[0]+.35,spec[1]+.35,dist)}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state==='play'){elapsed=(now-t0)/1000;$('#clock').textContent=fmt(elapsed+penalty)}
 lift+=(liftTarget-lift)*(1-Math.exp(-6*dt));lifted.position.y=lift*.11;poseJack(.3+lift*.11-.03);
 if(hold){hold.t=(now-hold.start)/1000;const k=hold.t/hold.need;
  if(phase==='loosen'){const p=hold.n.position;p.z=.105+Math.min(1,k)*.05;hold.n.rotation.z-=dt*30;wrench.position.copy(nutWorld(hold.n));$('#ringArc').style.strokeDashoffset=213.6*(1-Math.min(1,k));
   const s=nutWorld(hold.n).project(camera);const r=$('#ring');r.style.left=(s.x*.5+.5)*innerWidth+'px';r.style.top=(-s.y*.5+.5)*innerHeight+'px';
   if(k>=1){const n=hold.n;hold=null;stopWrench();nutLoosened(n)}}
  else{const v=Math.min(1,k*.5);hold.n.rotation.z+=dt*20;const f=$('#torque .fill');f.style.width=v*100+'%';f.classList.toggle('over',v>level.zone[1]);if(v>=1&&!hold.maxed){hold.maxed=true;say('Zu fest! Loslassen.',800)}}}
 if(swapAnim)swapAnim();
 cameraFor();camPos.lerp(camGoal,1-Math.exp(-3.5*dt));if(camPos.lengthSq()===0)camPos.copy(camGoal);lookNow.lerp(camLook,1-Math.exp(-3.5*dt));camera.position.copy(camPos);camera.lookAt(lookNow);
 renderer.render(scene,camera)}
camPos.set(.35,.8,2.2);
startLevel.toString;openMenu();
// idle scene behind the menu
hub.add(oldWheel);nuts.forEach(n=>n.position.set(STUD[n.userData.i].x,STUD[n.userData.i].y,.105));scene.add(newWheel);newWheel.position.set(1.15,.39,.25);newWheel.rotation.set(0,-.35,.08);
requestAnimationFrame(frame);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
window.__rw={get:()=>({state,phase,lift:+lift.toFixed(2),pumps,penalty,nuts:nuts.map(n=>n.userData.state)})};
</script></body></html>
