const MUZZLE=820,G=9.81;

// March along the ray against the terrain height function (much cheaper than raycasting the mesh).
function groundImpact(o,dir){let prev=0;for(let d=2;d<900;d+=d<100?.5:1.5){const p=o.clone().addScaledVector(dir,d);if(p.y<=H(p.x,p.z)){for(let k=0;k<8;k++){const m=(prev+d)/2,q=o.clone().addScaledVector(dir,m);if(q.y<=H(q.x,q.z))d=m;else prev=m}return o.clone().addScaledVector(dir,d)}prev=d}return null}
const puffs=[];function dust(p,color=0x9c8a6a){if(!p)return;for(let i=0;i<12;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.12,6,4),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.7}));m.position.copy(p);m.userData.v=new THREE.Vector3((Math.random()-.5)*1.5,1+Math.random()*1.5,(Math.random()-.5)*1.5);scene.add(m);puffs.push(m)}}
function impact(best,p){
 if(best){const a=best.a;
  if(a.kind==='target'){a.alive=false;hits++;say(`Treffer · ${best.quality} Ringe`);sfx.tone(1200,.15,'triangle',.15);a.obj.children[0].material=targetMat.clone();a.obj.children[0].material.emissive=new THREE.Color(0x2a5a20);a.obj.rotation.x=-.25}
  else{a.alive=false;hits++;a.mixer.stopAllAction();a.falling=0;say(best.quality>1?'Sauberer Blattschuss!':'Treffer!');
   if(trophy('jagd','erster-fuchs','Erster Fuchs'));if(best.d>=200)trophy('jagd','weitschuss','Weitschuss über 200 m');
   // the others hear the shot
   animals.forEach(o=>{if(o.alive&&o.kind==='fox'){o.fleeing=true;setMode(o,'run');o.obj.rotation.y=Math.atan2(o.obj.position.x,o.obj.position.z)}})}}
 else{dust(p);say(ammo>0?'Vorbei!':'Daneben …',1200);animals.forEach(o=>{if(o.alive&&o.kind==='fox'&&o.obj.position.distanceTo(p||o.obj.position)<40){o.fleeing=true;setMode(o,'run');o.obj.rotation.y=Math.atan2(o.obj.position.x,o.obj.position.z)}})}
 hud();checkEnd()}
function checkEnd(){if(hits>=level.goal)return setTimeout(()=>finish(true),1300);
 const left=animals.filter(a=>a.alive).length;if(ammo<=0||left===0||level.goal-hits>left)setTimeout(()=>finish(false),1500)}
function finish(ok){if(state!=='play')return;state='done';setScope(false);const idx=LEVELS.indexOf(level);
 if(ok){progress.unlock('jagd',idx+1);trophy('jagd','level-'+level.id,`${level.name} geschafft`);if(shots===hits&&level.kind==='fox')trophy('jagd','ohne-fehlschuss','Keine Kugel daneben');sfx.win()}
 $('#cardTitle').textContent=ok?'Waidmannsheil!':'Heute nicht';$('#cardText').textContent=`${hits} Treffer mit ${shots} Schuss.`+(ok?(idx<LEVELS.length-1?' Das nächste Revier ist frei.':' Du hast alle Reviere gemeistert.'):' Probier es nochmal.');
 $('#cardBtn').textContent=ok?'Zur Auswahl':'Nochmal';$('#cardBtn').onclick=()=>{$('#card').classList.add('hidden');ok?openMenu():startLevel(idx)};$('#card').classList.remove('hidden')}

function startLevel(i){level=LEVELS[i];$('#menu').classList.add('hidden');$('#levelInfo').textContent=level.name;state='play';ammo=level.ammo;hits=0;shots=0;breath=1;yaw=0;pitch=-.04;
 windV=level.wind?(Math.random()<.5?-1:1)*level.wind*(.6+Math.random()*.4):0;
 const [el,az]=level.sun;sunV.setFromSphericalCoords(1,THREE.MathUtils.degToRad(90-el),THREE.MathUtils.degToRad(az));su.sunPosition.value.copy(sunV);
 sun.position.copy(sunV).multiplyScalar(300);sun.color.set(el<4?0xffa36a:el<12?0xffd3a8:0xfff2e2);sun.intensity=el<4?1.1:el<12?1.8:2.6;hemi.intensity=el<4?.35:.7;
 scene.fog=new THREE.FogExp2(el<4?0x8a7a78:el<12?0xc9c8c0:0xbfcbd4,level.fog);renderer.toneMappingExposure=el<4?.42:.5;
 if(envRT)envRT.dispose();const tmp=new THREE.Scene();tmp.add(sky);envRT=pmrem.fromScene(tmp);scene.add(sky);scene.environment=envRT.texture;
 spawn();hud();$('#hint').textContent=level.kind==='targets'?'Die Scheiben stehen vor dir · Zielfernrohr nehmen':'Such die Füchse auf der Wiese';setTimeout(()=>$('#hint').textContent='',6000)}
function openMenu(){state='menu';setScope(false);clearAnimals();const box=$('#levels');box.innerHTML='';const un=progress.unlocked('jagd');
 LEVELS.forEach((L,i)=>{const b=document.createElement('button');b.className='level'+(i>un?' locked':'');b.innerHTML=`<b>${i+1}. ${L.name}</b><small>${i>un?'🔒 Erst das vorige Level schaffen':L.text}</small>`;if(i<=un)b.onclick=()=>startLevel(i);box.appendChild(b)});
 $('#menu').classList.remove('hidden')}
openMenu();startPreview();
function startPreview(){const [el,az]=LEVELS[1].sun;sunV.setFromSphericalCoords(1,THREE.MathUtils.degToRad(90-el),THREE.MathUtils.degToRad(az));su.sunPosition.value.copy(sunV);sun.position.copy(sunV).multiplyScalar(300);scene.fog=new THREE.FogExp2(0xc9c8c0,.003)}

// ---------- Loop ----------
let last=performance.now(),time=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;grassUniforms.time.value=time;
 // Breath: holding drains it; once empty the sway gets worse until you breathe again.
 if(holding){breath-=dt/4.5;if(breath<=0){breath=0;holding=false;$('#breath').classList.remove('active');say('Luft holen …',900)}}else breath=Math.min(1,breath+dt/3);
 $('#breathBar i').style.width=breath*100+'%';
 const calm=holding?.12:(breath<.3?1.6:1);swayT+=dt;
 const sway=level.sway*calm*(scoped?1:.3)*.004;
 const swayX=(Math.sin(swayT*.9)+Math.sin(swayT*2.3)*.4)*sway,swayY=(Math.sin(swayT*1.3+1)+Math.cos(swayT*3.1)*.3)*sway*.8+Math.sin(swayT*.45)*sway*.6;
 recoil*=Math.exp(-6*dt);
 const targetFov=scoped?BASE_FOV/zoom:BASE_FOV;camera.fov+=(targetFov-camera.fov)*(1-Math.exp(-14*dt));camera.updateProjectionMatrix();
 camera.rotation.y=yaw+swayX;camera.rotation.x=pitch+swayY+recoil*.05;
 if(windT-->0);if(level.wind&&Math.random()<dt*.15){windV=THREE.MathUtils.clamp(windV+(Math.random()-.5)*1.2,-level.wind*1.3,level.wind*1.3);hud()}
 for(const a of animals){if(a.kind!=='fox')continue;a.mixer.update(dt);
  if(!a.alive){if(a.falling!==undefined&&a.falling<1){a.falling+=dt*2.2;a.obj.rotation.z=Math.min(1,a.falling)*Math.PI/2*.95;a.obj.position.y=H(a.obj.position.x,a.obj.position.z)+Math.min(1,a.falling)*.12}continue}
  a.modeT-=dt;
  if(!a.fleeing&&a.modeT<=0){if(a.mode==='survey'&&Math.random()<level.move+.1){setMode(a,Math.random()<level.move*.5?'run':'walk');a.obj.rotation.y+=(Math.random()-.5)*2}else setMode(a,'survey');a.modeT=2+Math.random()*5}
  if(a.speed){const f=new THREE.Vector3(Math.sin(a.obj.rotation.y),0,Math.cos(a.obj.rotation.y));a.obj.position.addScaledVector(f,a.speed*dt);const p=a.obj.position;
   const r=Math.hypot(p.x,p.z);if(!a.fleeing&&(r<45||r>level.dist[1]+60)){a.obj.rotation.y=Math.atan2(-p.x,-p.z)+(r<45?Math.PI:0)+(Math.random()-.5)}
   p.y=H(p.x,p.z);if(a.fleeing&&r>420){a.alive=false;a.gone=true;scene.remove(a.obj);checkEnd()}}}
 for(let i=puffs.length-1;i>=0;i--){const m=puffs[i];m.userData.v.y-=3*dt;m.position.addScaledVector(m.userData.v,dt);m.scale.multiplyScalar(1+dt*1.5);m.material.opacity-=dt*.6;if(m.material.opacity<=0){scene.remove(m);puffs.splice(i,1)}}
 if(scoped&&Math.floor(time*8)!==Math.floor((time-dt)*8)){const dir=new THREE.Vector3();camera.getWorldDirection(dir);const h=groundImpact(camera.position,dir);$('#range').textContent=h?`${Math.round(h.distanceTo(camera.position))} m`:'— m'}
 renderer.render(scene,camera)}
requestAnimationFrame(frame);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(scoped)drawScope()});
</script></body></html>
