const bottomRail=box(9.05,.09,.21,0,.34,.18,edge,door);
const grip=box(.65,.055,.07,0,.49,.3,metal,door);
let garageAssetsReady,amount=0,goal=0,last=performance.now(),touching=false,sx=0,sy=0,dragGate=false;

// Full 360-degree first-person looking, with vertical tilt. A vertical swipe
// only controls the roller door while it is closed; once inside, all swipes look.
let yaw=0,pitch=0,inside=false;const walker=new THREE.Vector3(0,1.78,-3.1);const moveKeys=new Set();let touchWalk=0;
addEventListener('keydown',e=>{const k={KeyW:'forward',ArrowUp:'forward',KeyS:'back',ArrowDown:'back',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'}[e.code];if(k){moveKeys.add(k);e.preventDefault()}});addEventListener('keyup',e=>{const k={KeyW:'forward',ArrowUp:'forward',KeyS:'back',ArrowDown:'back',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'}[e.code];if(k)moveKeys.delete(k)});
// Two independent touch zones: left thumb moves, right thumb turns the camera.
// Both fingers can be held at once. Keyboard WASD remains supported.
const fingers=new Map();let walkOrigin=null,lookPointer=null,strafeTouch=0,velocityX=0,velocityZ=0,lookDX=0,lookDY=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 e.preventDefault();renderer.domElement.setPointerCapture(e.pointerId);
 const kind=inside?(e.clientX<innerWidth*.48?'move':'look'):'gate';
 const data={kind,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,t:performance.now()};
 fingers.set(e.pointerId,data);
 if(kind==='move')walkOrigin=e.pointerId;
 if(kind==='look')lookPointer=e.pointerId;
});
renderer.domElement.addEventListener('pointermove',e=>{
 const p=fingers.get(e.pointerId);if(!p)return;e.preventDefault();
 const dx=e.clientX-p.lastX,dy=e.clientY-p.lastY;
 if(p.kind==='move'){
   const radius=Math.max(65,Math.min(105,innerWidth*.24));
   const vx=(e.clientX-p.x)/radius,vy=(p.y-e.clientY)/radius;
   const mag=Math.hypot(vx,vy),dead=.12,scale=mag>dead?Math.min(1,(mag-dead)/(1-dead))/mag:0;
   touchWalk=vy*scale;strafeTouch=vx*scale;
 }else if(p.kind==='look'){
   lookDX+=dx;lookDY+=dy;
 }else if(p.kind==='gate'){
   if(Math.abs(e.clientY-p.y)>6&&Math.abs(e.clientY-p.y)>Math.abs(e.clientX-p.x)){
     amount=THREE.MathUtils.clamp(amount-dy/innerHeight*1.7,0,1);goal=amount;dragGate=true;
   }else{yaw-=dx*.004;pitch=THREE.MathUtils.clamp(pitch-dy*.003,-.7,.7)}
 }
 p.lastX=e.clientX;p.lastY=e.clientY;
});
// A short tap on the TV (from up to 12 m away) opens the game picker.
const tapRay=new THREE.Raycaster();tapRay.far=12;
function tappedTV(e){const r=renderer.domElement.getBoundingClientRect();
 tapRay.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);
 return tapRay.intersectObject(tvGroup,true).length>0}
function releasePointer(e){
 const p=fingers.get(e.pointerId);if(!p)return;
 if(e.type==='pointerup'&&inside&&Math.hypot(e.clientX-p.x,e.clientY-p.y)<14&&performance.now()-p.t<400&&tappedTV(e)){gamePick.classList.add('on');touchWalk=0;strafeTouch=0}
 if(p.kind==='move'){touchWalk=0;strafeTouch=0;walkOrigin=null}
 if(p.kind==='look')lookPointer=null;
 if(p.kind==='gate'&&dragGate){setGoal(amount>.4?1:0);dragGate=false}
 fingers.delete(e.pointerId);
}
renderer.domElement.addEventListener('pointerup',releasePointer);
renderer.domElement.addEventListener('pointercancel',releasePointer);
renderer.domElement.addEventListener('lostpointercapture',releasePointer);
// Post-processing: ambient occlusion darkens corners and contact points, bloom lets lamps glow.
const composer=new EffectComposer(renderer,new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType,samples:4}));composer.addPass(new RenderPass(scene,camera));
const ao=new GTAOPass(scene,camera,innerWidth,innerHeight);ao.updateGtaoMaterial({radius:.6,distanceExponent:1.4,thickness:1.2,scale:1.1,samples:12});ao.blendIntensity=.9;composer.addPass(ao);
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.22,.45,.92);composer.addPass(bloom);composer.addPass(new OutputPass());
// Keep phones smooth: if frames get slow, drop the heaviest effect first, then resolution.
let perfFrames=0,perfTime=0,perfStep=0;
function watchPerformance(dt){perfFrames++;perfTime+=dt;if(perfFrames<90)return;const avg=perfTime/perfFrames;perfFrames=0;perfTime=0;
 if(avg>.038&&perfStep===0){ao.enabled=false;perfStep=1}else if(avg>.038&&perfStep===1){renderer.setPixelRatio(1);composer.setPixelRatio(1);resize();perfStep=2}}
function resize(){renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?53:43;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(!dragGate)amount+=(goal-amount)*(1-Math.exp(-2.3*dt));
 slats.forEach((g,i)=>{const h=.47+i*.225+amount*6.4,above=h-5.85;if(above<=0){g.position.set(0,h,0);g.rotation.x=0}else{const angle=above/.64;g.position.set(0,5.85+.64*Math.sin(angle),-.64+.64*Math.cos(angle));g.rotation.x=-angle}g.visible=h<7.7});
 bottomRail.position.y=.34+Math.min(amount*6.4,5.6);grip.position.y=.49+Math.min(amount*6.4,5.45);bottomRail.visible=grip.visible=amount<.9;
 document.getElementById('progress').style.width=amount*100+'%';const distance=innerWidth<innerHeight?27:24,entry=Math.max(0,(amount-.65)/.35);inside=entry>.85;gamesBtn.classList.toggle('on',inside);
// Frame-rate-independent damped camera and walking velocity.
const turnBlend=1-Math.exp(-22*dt);
const stepX=lookDX*turnBlend,stepY=lookDY*turnBlend;
yaw-=stepX*.0052;pitch=THREE.MathUtils.clamp(pitch-stepY*.0038,-1.3,1.3);
lookDX-=stepX;lookDY-=stepY;
if(inside){
 const view=Math.PI+yaw,fx=Math.sin(view),fz=Math.cos(view),rx=-fz,rz=fx;
 let forward=touchWalk,side=strafeTouch;
 if(moveKeys.has('forward'))forward+=1;
 if(moveKeys.has('back'))forward-=1;
 if(moveKeys.has('right'))side+=1;
 if(moveKeys.has('left'))side-=1;
 const magnitude=Math.max(1,Math.hypot(forward,side));
 const targetX=(fx*forward+rx*side)/magnitude*3.7;
 const targetZ=(fz*forward+rz*side)/magnitude*3.7;
 const acceleration=1-Math.exp(-(Math.abs(forward)+Math.abs(side)>.01?12:18)*dt);
 velocityX+=(targetX-velocityX)*acceleration;
 velocityZ+=(targetZ-velocityZ)*acceleration;
 const nextX=THREE.MathUtils.clamp(walker.x+velocityX*dt,-9.8,9.8);
 const nextZ=THREE.MathUtils.clamp(walker.z+velocityZ*dt,-23.6,-1.6);
 const obstacles=[[-5.2,-5.8,1.6,3.35],[-6.55,-19.8,.85,1.85],[-8.4,-23.15,1.75,.85],[-8.55,-19.8,.6,.95],[-8.45,-16.9,.6,.55],[-10.3,-19.8,.6,1.7],[-3.4,-24.4,1.3,.5],[9.75,-9.9,.65,3.3],[10.4,-21.4,.75,3.6],[7.8,-24.4,2.6,.75],[8.5,-18.2,1.95,.6],[-10.1,-8,.9,7.5],[-10.25,-16.9,.55,.55]];
 const blocked=(x,z)=>obstacles.some(([cx,cz,hx,hz])=>Math.abs(x-cx)<hx&&Math.abs(z-cz)<hz);
 if(!blocked(nextX,walker.z))walker.x=nextX;else velocityX=0;
 if(!blocked(walker.x,nextZ))walker.z=nextZ;else velocityZ=0;
}else{velocityX=0;velocityZ=0}
if(inside)camera.position.copy(walker);else camera.position.set(0,THREE.MathUtils.lerp(4.1,1.78,entry),THREE.MathUtils.lerp(distance,-3.1,entry));
camera.fov=THREE.MathUtils.lerp(innerWidth<innerHeight?53:43,innerWidth<innerHeight?72:65,entry);camera.updateProjectionMatrix();
const baseYaw=Math.PI; // face into the workshop on entering
const viewYaw=baseYaw+yaw,viewPitch=pitch;
const lookDirection=new THREE.Vector3(Math.sin(viewYaw)*Math.cos(viewPitch),Math.sin(viewPitch),Math.cos(viewYaw)*Math.cos(viewPitch));
camera.lookAt(camera.position.clone().add(lookDirection));composer.render();if(garageAssetsReady!==undefined)watchPerformance(dt)
}requestAnimationFrame(animate);
