function texture(base,seed=1){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,512,512);let v=seed;const rnd=()=>{v=(v*1664525+1013904223)>>>0;return v/4294967296};for(let i=0;i<25000;i++){const n=Math.floor(rnd()*255);x.fillStyle='rgba('+n+','+n+','+n+','+(rnd()*.055)+')';x.fillRect(rnd()*512,rnd()*512,rnd()*3+1,rnd()*3+1)}for(let i=0;i<65;i++){x.fillStyle='rgba(35,35,35,'+(rnd()*.13)+')';x.beginPath();x.arc(rnd()*512,rnd()*512,rnd()*3.5,0,Math.PI*2);x.fill()}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t}
